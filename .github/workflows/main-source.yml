name: Main source

# 브랜치는 task/* → develop → main 한 방향으로만 올라간다. main 대상 PR은 이 저장소의 develop에서 온 것만 받는다.
# ruleset에는 출발 브랜치를 제한하는 설정이 없어 필수 검사로 막는다.
# 모든 PR에서 결과가 생겨야 필수 검사가 "대기"로 남지 않으므로 대상 브랜치 필터를 두지 않고, main이 아니면 통과시킨다.
on:
  pull_request:
    types: [ opened, reopened, synchronize, edited ]

permissions: {}

jobs:
  main-source:
    runs-on: ubuntu-latest

    steps:
      # PR 코드를 받지 않고 이벤트의 브랜치 정보만 읽는다. edited는 대상 브랜치를 바꿨을 때 다시 검사하기 위해 받는다.
      - name: Check source branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "대상이 main이 아닙니다 ($BASE_REF). 검사하지 않습니다."
            exit 0
          fi
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_REF" != "develop" ]; then
            echo "::error::main에는 $GITHUB_REPOSITORY의 develop에서 온 PR만 올릴 수 있습니다 (지금: $HEAD_REPO:$HEAD_REF)"
            exit 1
          fi
          echo "develop → main PR입니다."
