name: Release

# develop 머지마다 이미지를 한 번 빌드해 sha-<커밋 7자리>로 올린다.
# 릴리스는 이 이미지를 다시 빌드하지 않고 같은 digest에 버전 태그만 붙인다.
on:
  push:
    branches: [ develop ]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/orbit-cloud-labs/orbit-server

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance·sbom을 끄면 이미지가 manifest 하나로 올라간다.
      # 버전 태그를 붙일 때 같은 manifest를 그대로 가리키고, 정리 워크플로가 태그 없는 하위 manifest를 다룰 필요가 없다.
      - name: Build and push
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "이미지: \`$IMAGE_NAME:$TAG@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
