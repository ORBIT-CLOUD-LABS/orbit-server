name: Release

# main 머지마다 이미지를 한 번 빌드해 sha-<커밋 7자리>로 올린다.
# 팀 작업은 develop에 모으고, 배포할 때만 develop→main PR을 머지한다 (develop 머지에서는 검사만 돈다).
# 릴리스는 이 이미지를 다시 빌드하지 않고 같은 digest에 버전 태그만 붙인다.
on:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/orbit-cloud-labs/orbit-server

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance·sbom을 끄면 이미지가 manifest 하나로 올라간다.
      # 버전 태그를 붙일 때 같은 manifest를 그대로 가리키고, 정리 워크플로가 태그 없는 하위 manifest를 다룰 필요가 없다.
      - name: Build and push
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "이미지: \`$IMAGE_NAME:$TAG@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      packages: write
    # 릴리스는 한 번에 하나만 진행한다. 버전 순서가 커밋 순서와 어긋나지 않게 한다.
    concurrency:
      group: orbit-server-release
      cancel-in-progress: false

    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          path: source

      - name: Find merged pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pulls="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"
          merged="$(jq -c '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $ENV.GITHUB_SHA)]' <<<"$pulls")"
          count="$(jq length <<<"$merged")"
          if [ "$count" -gt 1 ]; then
            echo "::error::이 커밋으로 머지된 PR이 둘 이상입니다"
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "PR 머지 커밋이 아닙니다. 릴리스하지 않습니다."
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "labels=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$(jq -r '.[0].number' <<<"$merged")" >> "$GITHUB_OUTPUT"
          echo "labels=$(jq -c '.[0].labels | map(.name)' <<<"$merged")" >> "$GITHUB_OUTPUT"

      - name: Decide version
        id: version
        working-directory: source
        env:
          LABELS: ${{ steps.pr.outputs.labels }}
        run: |
          set -euo pipefail
          release_tags() { grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true; }
          # 재실행: 이 커밋에 이미 버전 태그가 있으면 그 버전으로 남은 단계만 이어서 한다.
          existing="$(git tag --points-at HEAD --list 'v*' | release_tags)"
          if [ "$(printf '%s' "$existing" | grep -c .)" -gt 1 ]; then
            echo "::error::이 커밋에 버전 태그가 둘 이상입니다: $(echo $existing)"
            exit 1
          fi
          if [ -n "$existing" ]; then
            echo "이 커밋은 이미 $existing 입니다. 남은 단계만 진행합니다."
            echo "version=${existing#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag --list 'v*' | release_tags > "$RUNNER_TEMP/tags.txt"
          version="$(python3 .github/scripts/release_version.py --labels-json "$LABELS" --tags-file "$RUNNER_TEMP/tags.txt")"
          if [ -z "$version" ]; then
            echo "릴리스 라벨이 없습니다. 이미지만 올리고 배포하지 않습니다."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 오래된 커밋의 늦은 실행이 더 높은 버전을 받지 않게, 직전 릴리스가 이 커밋의 조상일 때만 진행한다.
          latest="$(sort -V "$RUNNER_TEMP/tags.txt" | tail -n 1)"
          if [ -n "$latest" ] && ! git merge-base --is-ancestor "$latest" HEAD; then
            echo "::error::직전 릴리스 $latest 가 이 커밋의 조상이 아닙니다. 더 새 커밋이 이미 릴리스됐습니다."
            exit 1
          fi
          echo "다음 버전: $version (직전: ${latest:-없음})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.version.outputs.version != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.version.outputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 다시 빌드하지 않고 검사·발행한 같은 manifest에 버전 태그만 붙인다.
      # GHCR 태그 잠금 기능에 기대지 않고, 같은 버전 태그가 다른 이미지에 있으면 여기서 멈춘다.
      - name: Tag image with version
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_TAG: ${{ needs.image.outputs.tag }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r '.digest'; }
          test "$(digest_of "$IMAGE_NAME:$SOURCE_TAG")" = "$DIGEST" \
            || { echo "::error::$SOURCE_TAG 이미지의 digest가 빌드 결과와 다릅니다"; exit 1; }
          if existing="$(digest_of "$IMAGE_NAME:$VERSION" 2>/dev/null)" && [ -n "$existing" ]; then
            if [ "$existing" = "$DIGEST" ]; then
              echo "$VERSION 태그가 이미 같은 이미지에 있습니다 (재실행)."
              exit 0
            fi
            echo "::error::$VERSION 태그가 다른 이미지($existing)에 이미 있습니다. 버전 태그는 옮기지 않습니다."
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:$VERSION" "$IMAGE_NAME@$DIGEST"
          test "$(digest_of "$IMAGE_NAME:$VERSION")" = "$DIGEST" \
            || { echo "::error::$VERSION 태그의 digest가 원본과 다릅니다"; exit 1; }
          echo "이미지 버전 태그: \`$IMAGE_NAME:$VERSION@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      # 태그 ruleset이 v* 생성을 이 App에만 허용한다. orbit-gitops 커밋에도 같은 토큰을 쓴다.
      - name: Create release App token
        if: steps.version.outputs.version != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ORBIT-CLOUD-LABS
          repositories: |
            orbit-server
            orbit-gitops
          permission-contents: write

      - name: Create Git tag
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = orbit-cloud-gitops-bot || { echo "::error::예상하지 않은 App: $APP_SLUG"; exit 1; }
          tag="v$VERSION"
          if current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$current" = "$GITHUB_SHA" ]; then
              echo "$tag 태그가 이미 이 커밋에 있습니다 (재실행)."
              exit 0
            fi
            echo "::error::$tag 태그가 다른 커밋($current)에 이미 있습니다."
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          echo "Git 태그: \`$tag\` → \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout orbit-gitops
        if: steps.version.outputs.version != ''
        uses: actions/checkout@v4
        with:
          repository: ORBIT-CLOUD-LABS/orbit-gitops
          ref: develop
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          path: gitops

      - name: Configure orbit-gitops commit author
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot_id="$(gh api "users/$APP_SLUG[bot]" --jq '.id')"
          [[ "$bot_id" =~ ^[0-9]+$ ]]
          git -C gitops config user.name "$APP_SLUG[bot]"
          git -C gitops config user.email "$bot_id+$APP_SLUG[bot]@users.noreply.github.com"

      - name: Set up Python
        if: steps.version.outputs.version != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release script dependency
        if: steps.version.outputs.version != ''
        run: python -m pip install --disable-pip-version-check -r source/.github/requirements-release.txt

      # App이 ruleset 우회로 직접 커밋하므로 orbit-gitops PR 검사를 거치지 않는다.
      # 스크립트는 orbit-server 이미지 항목 하나만 바꾸고, 그 밖의 변경이 생기면 실패한다.
      - name: Update orbit-gitops ota/base image
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          GIT_TERMINAL_PROMPT: '0'
        run: python source/.github/scripts/update_gitops_image.py --gitops gitops
