name: Docker Publish

on:
  push:
    branches: [ phase1 ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/orbit-cloud-labs/orbit-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:phase1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    concurrency:
      group: orbit-server-phase1-gitops
      cancel-in-progress: false
    steps:
      - name: Checkout published source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Create GitOps installation token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: gitops-token
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ORBIT-CLOUD-LABS
          repositories: orbit-gitops
          permission-contents: write

      - name: Checkout GitOps main
        uses: actions/checkout@v4
        with:
          repository: ORBIT-CLOUD-LABS/orbit-gitops
          ref: main
          token: ${{ steps.gitops-token.outputs.token }}
          fetch-depth: 0
          path: gitops

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install updater dependency
        run: python -m pip install -r source/.github/requirements-gitops.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for image verification
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published image identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          observed=$(docker buildx imagetools inspect "$IMAGE_NAME:$SOURCE_SHA" \
            --format '{{json .Manifest}}' | python -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          test "$observed" = "$IMAGE_DIGEST"

      - name: Configure GitOps commit author
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          APP_SLUG: ${{ steps.gitops-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = orbit-cloud-gitops-bot
          bot_id=$(gh api "users/$APP_SLUG[bot]" --jq '.id')
          [[ "$bot_id" =~ ^[0-9]+$ ]]
          git -C gitops config user.name "$APP_SLUG[bot]"
          git -C gitops config user.email "$bot_id+$APP_SLUG[bot]@users.noreply.github.com"

      - name: Update only the server deployment image
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          GIT_TERMINAL_PROMPT: '0'
        run: python source/.github/scripts/update_gitops_image.py --source source --gitops gitops
