name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_pw
          MYSQL_DATABASE: orbit_test
          MYSQL_USER: orbit_test
          MYSQL_PASSWORD: test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/orbit_test?allowPublicKeyRetrieval=true&useSSL=false
      TEST_DB_USERNAME: orbit_test
      TEST_DB_PASSWORD: test_pw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: ./gradlew build
