name: CI

on:
  push:
    branches: [ develop, main, phase1 ]
  # 필수 검사이므로 대상 브랜치·paths 필터를 두지 않는다. 검사가 생기지 않은 PR은 머지가 막힌다.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # 테스트 DB 는 Testcontainers 가 러너의 Docker 로 직접 띄운다
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: ./gradlew build

  docker-build:
    # 필수 검사라 잡은 항상 돌고, 이미지 설정이 바뀐 PR에서만 실제로 빌드한다 (push 안 함).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check image build inputs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "PR이 아니므로 건너뜁니다."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(Dockerfile|\.dockerignore|build\.gradle|settings\.gradle|gradle/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "이미지 설정 변경이 없어 Docker 빌드를 건너뜁니다."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.changes.outputs.build == 'true'
        run: docker build --tag orbit-server:pr-${{ github.event.pull_request.number }} .
