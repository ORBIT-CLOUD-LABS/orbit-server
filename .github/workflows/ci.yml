name: CI

on:
  push:
    branches: [ develop, phase1 ]
  # 필수 검사이므로 대상 브랜치·paths 필터를 두지 않는다. 검사가 생기지 않은 PR은 머지가 막힌다.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # 테스트 DB 는 Testcontainers 가 러너의 Docker 로 직접 띄운다
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: ./gradlew build
