# 컨텍스트 테스트는 S3 클라이언트를 만들기만 하고 Origin 에 접속하지 않으므로 더미 값을 쓴다
orbit:
  origin:
    endpoint: http://localhost:8333
    region: us-east-1
    bucket: test-bucket
    access-key: test-access-key
    secret-key: test-secret-key
  enrollment:
    key: test-enrollment-key
  admin:
    token: test-admin-token
  signing:
    # RFC 8032 7.1 TEST 1 의 공개 키. 공개된 시험 벡터라 개인 키도 알려져 있으므로 테스트 외에는 쓰지 않는다.
    # 서명 검증 테스트는 실행 중에 키 쌍을 만들어 쓰고, 여기서는 컨텍스트가 뜨도록 올바른 공개 키 하나만 둔다
    public-keys:
      v1: 11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo=
  cdn:
    default-edge-id: edge-seoul
    url-signing:
      key-id: test
      secret: test-url-signing-secret-0123456789
    # Edge 주소는 접속되지 않는 가짜 주소다. 테스트에서는 AlwaysUpEdgeHealthProbe 가 헬스체크를 대신해 모든 Edge 를 정상으로 본다
    # flow.md 의 Edge 3개 예시와 같은 구성. Edge 선택 테스트가 가까운 순서와 기본 Edge 를 구분하는 데 쓴다
    edges:
      - id: edge-seoul
        name: 서울
        base-url: http://cdn.test:30081
        latitude: 37.5665
        longitude: 126.9780
      - id: edge-daejeon
        name: 대전
        base-url: http://cdn.test:30082
        latitude: 36.3504
        longitude: 127.3845
      - id: edge-busan
        name: 부산
        base-url: http://cdn.test:30083
        latitude: 35.1796
        longitude: 129.0756
