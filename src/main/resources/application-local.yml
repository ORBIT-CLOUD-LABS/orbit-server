spring:
  config:
    # Spring 은 .env 를 자동으로 읽지 않으므로 properties 형식으로 불러온다. 파일이 없으면 무시한다
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vehicle_db}

# 로컬 SeaweedFS(S3 기본 포트 8333)를 가정한 기본값. 띄우지 않으면 업로드만 502 로 실패하고 앱은 실행된다
orbit:
  origin:
    endpoint: ${ORIGIN_ENDPOINT:http://localhost:8333}
    bucket: ${ORIGIN_BUCKET:orbit-firmware}
    access-key: ${ORIGIN_ACCESS_KEY:local-access-key}
    secret-key: ${ORIGIN_SECRET_KEY:local-secret-key}
  enrollment:
    key: ${ENROLLMENT_KEY:local-enrollment-key}
  admin:
    token: ${ADMIN_TOKEN:local-admin-token}
  cdn:
    # 로컬에는 Edge 가 없으므로 Edge 선택 확인용 임시 목록. 좌표는 flow.md 의 서울·대전·부산 Edge 와 같다
    default-edge-id: edge-seoul
    url-signing:
      key-id: ${CDN_URL_SIGNING_KEY_ID:local}
      secret: ${CDN_URL_SIGNING_SECRET:local-url-signing-secret-0123456789}
    edges:
      - id: edge-seoul
        name: 서울
        base-url: http://localhost:30081
        latitude: 37.5665
        longitude: 126.9780
      - id: edge-daejeon
        name: 대전
        base-url: http://localhost:30082
        latitude: 36.3504
        longitude: 127.3845
      - id: edge-busan
        name: 부산
        base-url: http://localhost:30083
        latitude: 35.1796
        longitude: 129.0756

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.orbit.server: DEBUG
