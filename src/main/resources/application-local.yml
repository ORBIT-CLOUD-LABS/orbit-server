spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vehicle_db}

# 로컬 SeaweedFS(S3 기본 포트 8333)를 가정한 기본값. 띄우지 않으면 업로드만 502 로 실패하고 앱은 실행된다
orbit:
  origin:
    endpoint: ${ORIGIN_ENDPOINT:http://localhost:8333}
    bucket: ${ORIGIN_BUCKET:orbit-firmware}
    access-key: ${ORIGIN_ACCESS_KEY:local-access-key}
    secret-key: ${ORIGIN_SECRET_KEY:local-secret-key}
  enrollment:
    key: ${ENROLLMENT_KEY:local-enrollment-key}
  admin:
    token: ${ADMIN_TOKEN:local-admin-token}
  # 로컬에는 CDN 이 없으므로 매니페스트 응답 확인용 임시 주소. 실제로 받으려면 환경 변수로 바꾼다
  cdn:
    base-url: ${CDN_BASE_URL:http://localhost:8080}

logging:
  level:
    com.orbit.server: DEBUG
