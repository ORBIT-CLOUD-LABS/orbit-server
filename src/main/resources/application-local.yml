spring:
  config:
    # Spring 은 .env 를 자동으로 읽지 않으므로 properties 형식으로 불러온다. 파일이 없으면 무시한다
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vehicle_db}

orbit:
  # 로컬에는 NFS 가 없으므로 홈 디렉터리 아래에 쓴다. 저장소 안에 두지 않아 실수로 커밋되거나 gradle clean 으로 지워지지 않는다
  origin:
    root-path: ${ORIGIN_ROOT_PATH:${user.home}/.orbit/origin}
  enrollment:
    key: ${ENROLLMENT_KEY:local-enrollment-key}
  admin:
    token: ${ADMIN_TOKEN:local-admin-token}
  # 로컬에는 CDN 이 없으므로 매니페스트 응답 확인용 임시 주소. 실제로 받으려면 환경 변수로 바꾼다
  cdn:
    base-url: ${CDN_BASE_URL:http://localhost:8080}

logging:
  level:
    com.orbit.server: DEBUG
