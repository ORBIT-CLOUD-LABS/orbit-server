spring:
  application:
    name: orbit-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # DB 기본값(CURRENT_TIMESTAMP)으로 채우는 시각과 애플리케이션이 넘기는 시각의 기준을 UTC 로 맞춘다.
    # DB_URL 은 환경마다 주입되므로 URL 파라미터가 아닌 드라이버 속성으로 고정한다.
    # 'UTC' 대신 오프셋을 쓰는 이유: 시간대 테이블이 없는 MySQL 에서도 세션 time_zone 설정이 실패하지 않게 하기 위해서다.
    hikari:
      data-source-properties:
        connectionTimeZone: "+00:00"
        forceConnectionTimeZoneToSession: true
  servlet:
    multipart:
      # 펌웨어 최대 크기. 요청 전체는 파일과 함께 오는 폼 필드(model, version, sha256)만큼 여유를 둔다
      max-file-size: 1GB
      max-request-size: 1025MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

orbit:
  origin:
    endpoint: ${ORIGIN_ENDPOINT}
    # S3 호환 서버(SeaweedFS)는 리전을 검사하지 않으므로 SDK 기본값으로 둔다
    region: ${ORIGIN_REGION:us-east-1}
    bucket: ${ORIGIN_BUCKET}
    access-key: ${ORIGIN_ACCESS_KEY}
    secret-key: ${ORIGIN_SECRET_KEY}
  enrollment:
    key: ${ENROLLMENT_KEY}
  check-in:
    # 기본값은 요구사항 예시(30초). 데모처럼 빠른 반응이 필요하면 환경 변수로 줄인다
    interval-seconds: ${CHECK_IN_INTERVAL_SECONDS:30}
  cdn:
    # 매니페스트 다운로드 URL 은 이 주소 뒤에 Origin 경로(/firmware/...)를 붙여 만든다
    base-url: ${CDN_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
