spring:
  application:
    name: orbit-server
  autoconfigure:
    # 인증은 Bearer 토큰 필터가 맡아 사용자 저장소가 필요 없다.
    # 켜 두면 기본 사용자를 만들고 그 비밀번호를 로그에 남기므로 끈다
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # DB 기본값(CURRENT_TIMESTAMP)으로 채우는 시각과 애플리케이션이 넘기는 시각의 기준을 UTC 로 맞춘다.
    # DB_URL 은 환경마다 주입되므로 URL 파라미터가 아닌 드라이버 속성으로 고정한다.
    # 'UTC' 대신 오프셋을 쓰는 이유: 시간대 테이블이 없는 MySQL 에서도 세션 time_zone 설정이 실패하지 않게 하기 위해서다.
    hikari:
      data-source-properties:
        connectionTimeZone: "+00:00"
        forceConnectionTimeZoneToSession: true
  servlet:
    multipart:
      # 펌웨어 최대 크기. 요청 전체는 파일과 함께 오는 폼 필드(model, version, sha256)만큼 여유를 둔다
      max-file-size: 1GB
      max-request-size: 1025MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

orbit:
  origin:
    # 원본 저장소(NFS)를 쓰기로 마운트한 경로. 파일은 이 아래 Origin 경로(/firmware/...)에 쓴다.
    # 환경 변수가 없으면 플레이스홀더 원문이 그대로 경로가 되므로, 빈 기본값을 줘서 @NotNull 검증으로 앱이 뜨지 않게 한다
    root-path: ${ORIGIN_ROOT_PATH:}
  enrollment:
    # 환경 변수가 없으면 플레이스홀더 원문(${ENROLLMENT_KEY})이 그대로 키가 되므로,
    # 빈 기본값을 줘서 @NotBlank 검증으로 앱이 뜨지 않게 한다
    key: ${ENROLLMENT_KEY:}
  admin:
    # 환경 변수가 없으면 플레이스홀더 원문(${ADMIN_TOKEN})이 그대로 토큰이 되므로,
    # 빈 기본값을 줘서 @NotBlank 검증으로 앱이 뜨지 않게 한다
    token: ${ADMIN_TOKEN:}
  check-in:
    # 기본값은 요구사항 예시(30초). 데모처럼 빠른 반응이 필요하면 환경 변수로 줄인다
    interval-seconds: ${CHECK_IN_INTERVAL_SECONDS:30}
  dashboard:
    stream:
      # 요구사항의 약 1초 주기. pod 마다 이 주기로 변경분을 한 번 조회해 연결된 대시보드 전체에 보낸다
      poll-interval: ${DASHBOARD_STREAM_POLL_INTERVAL:1s}
      # 협의안(15초). 프록시·로드밸런서의 유휴 연결 타임아웃보다 짧게 둔다
      keep-alive-interval: ${DASHBOARD_STREAM_KEEP_ALIVE_INTERVAL:15s}
      # 체크인 트랜잭션 타임아웃(3초)보다 넉넉히 길게 둔다. 트랜잭션 타임아웃은 커밋 지연까지는 막지 못하기 때문이다.
      # 5초보다 짧으면 앱이 뜨지 않는다
      overlap: ${DASHBOARD_STREAM_OVERLAP:10s}
  cdn:
    # 매니페스트 다운로드 URL 은 이 주소 뒤에 Origin 경로(/firmware/...)를 붙여 만든다
    base-url: ${CDN_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        # prometheus 는 클러스터 안 수집기가 API 와 같은 포트(8080)로 긁어 간다. 인증 없이 열리므로 그 밖의 엔드포인트는 노출하지 않는다
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
